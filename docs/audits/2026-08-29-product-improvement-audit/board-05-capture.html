  <text x="1172" y="397" font-family="Inter" font-size="11" font-weight="700" letter-spacing="1.3" fill="#090909">07  TEST DRIVE · BRING THE FORM ABOVE THE FOLD</text>

  <text x="94" y="360" font-family="Inter" font-size="12" font-weight="700" letter-spacing="2" fill="#e1121b">STRENGTHS TO PRESERVE</text>
  <g><text x="94" y="402" font-family="Oswald" font-size="26" font-weight="700" fill="#e1121b">01</text><text x="152" y="399" font-family="Inter" font-size="15" font-weight="700" fill="#ffffff">Editorial black / white / red system</text><text x="152" y="425" font-family="Inter" font-size="13" fill="#bdbdb6">Distinctive, premium, and worth protecting.</text><line x1="94" y1="449" x2="682" y2="449" stroke="#343430"/></g>
<g><text x="94" y="490" font-family="Oswald" font-size="26" font-weight="700" fill="#e1121b">02</text><text x="152" y="487" font-family="Inter" font-size="15" font-weight="700" fill="#ffffff">Strong hierarchy and direct CTAs</text><text x="152" y="513" font-family="Inter" font-size="13" fill="#bdbdb6">The product tells customers what to do next.</text><line x1="94" y1="537" x2="682" y2="537" stroke="#343430"/></g>
<g><text x="94" y="578" font-family="Oswald" font-size="26" font-weight="700" fill="#e1121b">03</text><text x="152" y="575" font-family="Inter" font-size="15" font-weight="700" fill="#ffffff">Accessible structural foundations</text><text x="152" y="601" font-family="Inter" font-size="13" fill="#bdbdb6">Landmarks, labels, focus behavior, and dialog semantics exist.</text><line x1="94" y1="625" x2="682" y2="625" stroke="#343430"/></g>
<g><text x="94" y="666" font-family="Oswald" font-size="26" font-weight="700" fill="#e1121b">04</text><text x="152" y="663" font-family="Inter" font-size="15" font-weight="700" fill="#ffffff">Finance caveats and trust-pack intent</text><text x="152" y="689" font-family="Inter" font-size="13" fill="#bdbdb6">Transparency is already part of the product idea.</text><line x1="94" y1="713" x2="682" y2="713" stroke="#343430"/></g>
<g><text x="94" y="754" font-family="Oswald" font-size="26" font-weight="700" fill="#e1121b">05</text><text x="152" y="751" font-family="Inter" font-size="15" font-weight="700" fill="#ffffff">Real workflow breadth</text><text x="152" y="777" font-family="Inter" font-size="13" fill="#bdbdb6">Compare, trade-in, booking, alerts, analytics, and admin are present.</text><line x1="94" y1="801" x2="682" y2="801" stroke="#343430"/></g>
<g><text x="94" y="842" font-family="Oswald" font-size="26" font-weight="700" fill="#e1121b">06</text><text x="152" y="839" font-family="Inter" font-size="15" font-weight="700" fill="#ffffff">AI fallback and human handoff</text><text x="152" y="865" font-family="Inter" font-size="13" fill="#bdbdb6">Make it observable and grounded; do not throw it away.</text><line x1="94" y1="889" x2="682" y2="889" stroke="#343430"/></g>
